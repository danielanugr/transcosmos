openapi: 3.0.3
info:
  title: Task Management Platform API
  description: RESTful backend API for task management, secure file uploads, image thumbnails, and background queue processing.
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8000
    description: Local development server

paths:
  /api/health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: API status report

  /api/auth/login:
    post:
      summary: User authentication
      description: Validates email and password, returning a JWT Bearer token and user profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: alice@example.com
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Authentication successful
        '401':
          description: Invalid credentials
        '422':
          description: Validation failure

  /api/auth/logout:
    post:
      summary: Logout user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Token revoked successfully

  /api/auth/me:
    get:
      summary: Current user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details
        '401':
          description: Unauthenticated

  /api/tasks:
    get:
      summary: List tasks with pagination, filtering, and sorting
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: assigned_user_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
        - name: sort_by
          in: query
          schema:
            type: string
            default: created_at
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Paginated list of tasks

    post:
      summary: Create new task
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                priority:
                  type: string
                  enum: [low, medium, high, urgent]
                assigned_user_id:
                  type: integer
                due_date:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Task created and email notification queued
        '422':
          description: Validation error

  /api/tasks/{id}:
    get:
      summary: Get task details with attachments and comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task detail
        '404':
          description: Task not found

    put:
      summary: Update task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                priority:
                  type: string
                assigned_user_id:
                  type: integer
                due_date:
                  type: string
      responses:
        '200':
          description: Task updated

    delete:
      summary: Delete task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Task deleted

  /api/tasks/bulk-status:
    post:
      summary: Bulk update task statuses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - task_ids
                - status
              properties:
                task_ids:
                  type: array
                  items:
                    type: integer
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                async:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Bulk update queued or completed

  /api/tasks/export:
    post:
      summary: Export task data
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [csv, txt]
                  default: csv
      responses:
        '200':
          description: Export job queued

  /api/tasks/{id}/attachments:
    post:
      summary: Upload file attachment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded and thumbnail generated
        '422':
          description: Validation or virus scan failed

  /api/tasks/{id}/attachments/chunk:
    post:
      summary: Upload large file chunk (>50MB support)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - chunk
                - upload_id
                - file_name
                - chunk_index
                - total_chunks
              properties:
                chunk:
                  type: string
                  format: binary
                upload_id:
                  type: string
                file_name:
                  type: string
                chunk_index:
                  type: integer
                total_chunks:
                  type: integer
      responses:
        '200':
          description: Chunk saved or upload completed

  /api/attachments/{id}/download:
    get:
      summary: Download file attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: File stream

  /api/attachments/{id}:
    delete:
      summary: Delete attachment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Attachment deleted

  /api/tasks/{id}/comments:
    get:
      summary: List task comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comments list

    post:
      summary: Add comment to task
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - comment
              properties:
                comment:
                  type: string
      responses:
        '201':
          description: Comment created

  /api/comments/{id}:
    delete:
      summary: Delete comment
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Comment deleted

  /api/queue/stats:
    get:
      summary: Queue status and statistics
      responses:
        '200':
          description: Count of pending, processing, completed, and failed jobs

  /api/queue/work:
    post:
      summary: Process queue jobs on demand
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                queue:
                  type: string
                  default: default
                limit:
                  type: integer
                  default: 1
      responses:
        '200':
          description: Batch execution summary

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
